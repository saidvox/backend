spring:
  profiles:
    default: local
  application:
    name: cafe-de-barrio-backend

  jpa:
    open-in-view: false

  web:
    error:
      include-message: always
      include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:cafe-de-barrio-jwt-secret-key-2026-change-this-in-production}
  access-token-expiration: 900000
  issuer: cafe-de-barrio-backend

app:
  security:
    admin:
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:Admin12345*}
      role: ADMIN

server:
  port: 8080
